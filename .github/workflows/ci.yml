name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Install & test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ["17.0", "18.0", "19.0"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Sanity check (Python + XML well-formed)
        run: |
          python3 -m compileall -q "${{ matrix.version }}/as2expert_connector"
          python3 - "${{ matrix.version }}" <<'PY'
          import glob, sys, xml.dom.minidom
          for f in glob.glob(f"{sys.argv[1]}/as2expert_connector/**/*.xml", recursive=True):
              xml.dom.minidom.parse(f)
              print("ok", f)
          PY

      - name: Install the addon and run its tests
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/${{ matrix.version }}:/mnt/extra-addons:ro" \
            "odoo:${{ matrix.version }}" \
            odoo -d test_db \
              --db_host=localhost --db_port=5432 \
              --db_user=odoo --db_password=odoo \
              -i as2expert_connector \
              --test-enable --test-tags=/as2expert_connector \
              --stop-after-init --no-http \
              --log-level=test --logfile=/dev/stdout
